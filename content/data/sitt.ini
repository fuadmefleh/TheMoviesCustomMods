[SITT]

# All the times below are in milliseconds (i.e. use 1500 for 1.5 seconds)

# This is how long the tooltip remains onscreen after the mouse is no longer hovering over the source
# You can assign a value of 0 to keep the tooltip onscreen until another tooltip appears.
DelayBeforeSITTDisappears = 2000
DelayBeforeSITTDisappearsOnRightClick = 10000

# These two times specify the time you have to hover over an hud icon/character before the SITT info appears
HoverTimeBeforeWorldSITT = 0
HoverTimeBeforeHUDSITT = 0

# This determines the delay between the first item appearing, and the second
DelayBeforeSecondItem = 300

# This determines the delay between all the subsequent items
DelayBetweenFurtherItems = 1000

# This is the time in ms it takes for the priority threshold to drop from 1.0 to 'Ph'.
PriThresholdDropTime = 8000

# These values determine the shape of the bubbles. They can range from 0..1
# Wibblyness is how distorted (from a perfect rectangle) the bubbles are (0 would give a perfect rectangle)
# Roundness is how round the edges are (0 for very angular, 1 for smooth)
SITTGeneralWibblyness = 0.25
SITTGeneralRoundness = 0.5
SITTBuildingWibblyness = 0.25
SITTBuildingRoundness = 0.1

# This determines how accurately rules are evaluated to. 
# With a value of 0.01 the values 0.936, 0.937 and 0.941 are all rounded to 0.94
SITTRulePrecision = 0.001

# This is the maximum number of streams/build menu highlights to show at any one time
SITTMaxActiveStreams = 2
SITTMaxActiveHighlights = 2

# This is how long build-menu highlights remain before disappearing
SITTBuildHighlightTimeout = 15000

# Define a nice tutorial bubble colour here
TutorialBubbleColour = #C3C79C
TutorialBubbleBorder = #838568

# This is how long to delay before re-opening a dismissed tutorial bubble.
TutorialBubbleRespawnTime = 10000

# The delay is the time a player has to hover before a tooltip is shown
# The timeout is how long the bubble remains after the player stops hovering
ToolTipHoverDelay = 1500
ToolTipHoverTimeout = 200

# This is the vertical offset at which world SITTs will appear to the left/right
# of the object rather than above them. Currently it is only applied to certain
# types of objects (i.e. those which generate large SITTs)
HorizontalAnchorYThreshold = 200.0

# Don't change these (yet) :)
MS_BEFORE_CONTEXT_EXPIRES = 5000
SPARSE_PROCESS_INTERVAL = 20

# Priority thresholds:
PRI_THRESHOLD_EMERGENCY = 0.9
PRI_THRESHOLD_HOVER = 0.2
PRI_THRESHOLD_RCLICK = 0.1	

# Band times (in seconds, just to be different :)
# This is the time each band is active for before we show the next band down
BandTimeEmergency = 0.8
BandTimeHigh = 1.2
BandTimeMed = 3.0
BandTimeLow = 3.0


