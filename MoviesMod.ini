; MoviesMod settings. Lives next to MoviesSE.exe.
;
; Tuning overrides: one section per game data file, one line per key.
;   KEY = 0.5    replace the game's value
;   KEY = *0.5   multiply the game's value
; After each run, MoviesMod_tuning.txt lists every key the game read, with the
; section (file) name to use here and the value the game used.

[MoviesMod]
TuningOverrides = 1
DumpTuning = 1
; Log data files the game can't find (and any whose path contains WatchFiles).
LogMissingFiles = 1
WatchFiles = facility_tv_
; 1 shows the memory inspector toggle on the TV screen (for modding).
DevTools = 0
; 1 builds the TV Writers' Office as a real script office: writers sit at the desks and the
; finished script appears outside. 0 falls back to timer-based writing.
NativeTvWriters = 1

; --- Less micromanagement ----------------------------------------------------
; Mood values are per-tick changes: positive = builds up, negative = relieves.
; Game values (from MoviesMod_tuning.txt) are noted on each line.
[mood]
; Stress builds up half as fast on the job.
WORKINGONAMOVIESTRESS  = *0.5   ; 6e-05
REHEARSINGSTRESS       = *0.5   ; 6e-05
WAITINGONAMOVIESTRESS  = *0.5   ; 3e-05
; Idle stars get bored half as fast.
IDLINGBOREDOM          = *0.5   ; 4e-05
; Healthy breaks (food, trailer) work 50% faster, so stars spend less time away
; and drinking is less often the quickest fix. Drinking itself is unchanged.
RESTAURANTSTRESS       = *1.5   ; -0.0003
RESTAURANTBOREDOM      = *1.5   ; -0.0003
SNACKVANSTRESS         = *1.5   ; -0.00015
SNACKVANBOREDOM        = *1.5   ; -0.00015
TRAILERALONESTRESS     = *1.5   ; -8e-05
TRAILERTOGETHERSTRESS  = *1.5   ; -8e-05
EATDRINKONSPOTSTRESS   = *1.5   ; -0.0002
EATDRINKONSPOTBOREDOM  = *1.5   ; -0.0002

[addictions]
; Addiction builds up half as fast per drink or snack.
feed                   = *0.5   ; 0.0001
; ...and wears off twice as fast between them.
decayperminute         = *2     ; 0.002

[explainers/dustbin]
; People walk further to a bin instead of dropping litter.
range                  = 25     ; 10

; --- Fairer critics ---------------------------------------------------------
; A film's star rating (and its place in the Top Movies chart) is
;   boxoffice x success + quality x quality + awards x (won an award)
; The game weighs box office twice as heavily as quality and ignores awards, so
; a great film that sells poorly gets a poor review. These weights let quality
; lead, keep commercial success in the mix and give award winners a bump (the
; rating is recalculated when a film wins). Rival studios' films use the same
; weights. Applies to films released from now on.
[global]
starratingboxoffice = 0.45   ; 0.73
starratingquality   = 0.60   ; 0.33
starratingawards    = 0.08   ; 0
; (Less micromanagement) Handymen repair twice as fast, and litter hurts the
; studio's prestige half as much.
repairworkperhammermin = *2     ; 0.5
repairworkperhammermax = *2     ; 1.5
prestigelitterfactor   = *0.5   ; -0.05

; Studio ranking (the Top Studios table). The game weighs your bank balance as
; heavily as the reputation your films earn; these lean on the films and on
; awards instead.
starratingreputationfactor = 0.30   ; 0.239
starratingmoneyfactor      = 0.16   ; 0.239
starratingstarsfactor      = 0.21   ; 0.239
starratingawardsfactor     = 0.20   ; 0.144
starratingprestigefactor   = 0.14   ; 0.144

; --- Fairer film scoring (code changes, see src/ratings.cpp) -----------------
[Ratings]
; 0 restores the game's own formulas.
Enabled = 1
; How far cast, crew, sets and relationships can lift a film above its script.
; Each 0.1 of a gain counts this much, then this squared... The game's 0.8 caps
; the lift at +0.4; 0.9 lets superb production lift a weak script by up to ~0.9.
ProductionGainDecay = 0.9
; Share of a production shortfall that comes off the film's quality (game: 1).
ProductionLossScale = 0.75
; Box office = base + multiplier x success ^ this. The game's 2 makes one hit
; earn many times a decent film; 1.5 flattens the curve.
BoxOfficeExponent = 1.5
; Audiences mark down films shot with outdated kit: the game's unused
; technology_min (0.7) for the oldest camera/film/sound, technology_max (1) for
; the newest that had been invented when shooting began.
OutdatedTechnology = 1
; Audiences tire of costumes they have seen in your recent films, the way the
; game already handles sets (floor: costume_boredom_bound, 0.8). Each release
; adds this much boredom to its costumes, halving every 2 years.
CostumeBoredom = 1
CostumeBoredomBoost = 0.15

; --- Bigger lot -----------------------------------------------------------------
; The lot's three sizes (width,depth in metres) come from lot.ini; you buy the next
; size at the Production Office. A quoted value replaces the game's text; the mod
; never makes a lot smaller than lot.ini (or another lot mod) already does.
; Game: 0 = 192,128  1 = 256,192  2 = 300,224.
; WARNING: 360,260 crashed the game when a save loaded: the lot's ground grid is a fixed
; size (the community's lot mods hit the same ceiling). Off until the limit is mapped.
[lot]
;2 = "360,260"

; --- Build menu (src/buildmenu.cpp) ---------------------------------------------
[BuildMenu]
; Buttons above the building list that show one kind of building at a time: all,
; production, staff and talent, amenities, television. 0 = the game's single list.
Categories = 1
; Where the buttons sit (in the build menu's 1024x768 layout: the Facilities panel spans
; about x 92-442, y 28-512) and their size; Column = 0 lays them out in a row.
ButtonsX = 450
ButtonsY = 70
ButtonSize = 44
Column = 1

; --- Studio manager (src/manager.cpp) ----------------------------------------
[Manager]
; Idle stars (not on set, not in a building) unwind a little each day once they
; are getting worn down, so they don't all need dragging to the bar.
RestBreaks = 1
RestPerDay = 0.06
; Every few seconds an idle handyman is sent to your most run-down building
; (below this condition), the way dropping him on it would.
SendHandymen = 1
RepairBelow = 0.6

; --- Movie Maker and picture quality (src/moviemaker.cpp) ---------------------
[MovieMaker]
; Width of the Best export preset (height = 9/16 of it). The game's is 768
; (768x432); 1280 = 720p, 1920 = 1080p. Looks sharpest when the game runs at
; least this wide. 768 restores the game's own.
ExportWidth = 1280
; Export at 30 frames a second (the game uses 20 for most presets).
Export30fps = 1
; Let every export preset render at screen size instead of 512x512.
SharpPresets = 1
; Size of the texture each person's costume and face are painted into (game:
; 512). 1024 only pays off with higher-resolution costume and face textures
; installed (tools/upscale_textures.py); at the Best graphics level only.
CharacterTextureSize = 1024
; Every shoot completes instantly (the sandbox option), for long custom films.
InstantShoot = 0

; --- Television & Streaming --------------------------------------------------
[tv]
; Scale TV money if shows feel too rich or too poor next to your films.
IncomeScale = 1
CostScale   = 1

